<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Pink, Arthur</title>
  <style>
    :root {
      --bg: #f7f3ee;
      --card: #fffdfb;
      --text: #2b2b2b;
      --muted: #5f5a56;
      --accent: #a8654a;
      --accent-soft: #f0e0d7;
      --border: #e8ddd4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.7;
    }

    main.page-auteur {
      max-width: 820px;
      margin: 2.5rem auto;
      padding: 2rem 1.5rem 3rem;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
    }

    h1, h2, h3 {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      margin-top: 0;
    }

    h1 {
      font-size: clamp(2rem, 3vw, 2.8rem);
      margin-bottom: 1rem;
      padding-bottom: 0.7rem;
      border-bottom: 2px solid var(--accent-soft);
    }

    h2 {
      font-size: 1.35rem;
      color: var(--accent);
      margin-top: 2rem;
      margin-bottom: 0.8rem;
    }

    p {
      margin: 0 0 1rem;
      color: var(--text);
    }

    .portrait {
      margin: 1.5rem auto;
      text-align: center;
    }

    .portrait img {
      display: block;
      width: min(100%, 210px);
      height: auto;
      margin: 0 auto;
      border: 1px solid var(--border);
    }

    .portrait figcaption {
      margin-top: 0.5rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .intro {
      font-size: 1.08rem;
      color: var(--muted);
    }

    ul {
      margin: 0.5rem 0 1.2rem 1.2rem;
      padding-left: 1rem;
    }

    li {
      margin-bottom: 0.45rem;
    }

    .note {
      background: var(--accent-soft);
      border-left: 4px solid var(--accent);
      padding: 0.9rem 1rem;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <main class="page-auteur">
    <h1>Arthur W. Pink</h1>

    <figure class="portrait">
      <img src="https://commons.wikimedia.org/wiki/Special:FilePath/ArthurPink.jpg" alt="Portrait en noir et blanc d’Arthur Pink" loading="lazy">
      <figcaption>

    <p class="intro">
      Présentation de l’auteur. Complétez ici la biographie, les dates, les références ou le contexte historique.
    </p>

    <section>
      <h2>Biographie</h2>
      <p>
        Arthur Pink est une figure littéraire et intellectuelle dont l’œuvre mérite d’être présentée dans son contexte.
        Cette page peut accueillir une courte biographie, une synthèse de sa trajectoire et les éléments essentiels
        de son parcours.
      </p>
      <p>
        Vous pouvez ici préciser ses activités, ses centres d’intérêt, ses publications ou l’importance de son héritage.
        Le texte peut être enrichi avec des références fiables et des dates précises.
      </p>
    </section>

    <section>
      <h2>Œuvres</h2>
      <ul>
        <li>Ajouter le titre d’une œuvre majeure.</li>
        <li>Ajouter une deuxième référence bibliographique.</li>
        <li>Ajouter un court commentaire ou une synthèse.</li>
      </ul>
    </section>

    <section>
      <h2>Étude et influence</h2>
      <p>
        Cette section permet de mettre en lumière le rôle de l’auteur dans son domaine, ainsi que son influence sur
        les lectures, les idées ou la pensée contemporaine. Vous pouvez développer ici les thèmes principaux de son travail.
      </p>
    </section>

    <div class="note">
      Remplacez les textes d’exemple par des informations exactes, vérifiées et adaptées au site.
    </div>
  </main>
</body>
</html>
